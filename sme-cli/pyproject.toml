[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sme"
version = "0.1.0"
description = "SecureMicro Energy Templates CLI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
]

[project.scripts]
sme = "sme.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sme*"]
