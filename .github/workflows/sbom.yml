# =============================================================================
# .github/workflows/sbom.yml
#
# SBOM Workflow — SecureMicro-Energy-Templates
#
# Generates and publishes the CycloneDX Software Bill of Materials (SBOM)
# for the tmpl-rest-api module.
#
# Triggers:
#   - push to main branch (after CI gates pass)
#   - workflow_dispatch (manual trigger for on-demand SBOM generation)
#
# The SBOM (bom.xml) is generated by the cyclonedx-maven-plugin configured
# in the root pom.xml and in tmpl-rest-api/pom.xml, and is uploaded as a
# GitHub Actions artifact for downstream attestation and supply chain audits.
#
# CONTROL: INI-22 — SBOM gerado no formato CycloneDX em cada build do main.
# CONTROL: INI-26 — SBOM associado à imagem/build como artifact do workflow.
# CONTROL: RN-03  — proveniência de software via SBOM conforme EO 14028 §4(e).
# =============================================================================

name: SBOM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # Job — generate-sbom
  #
  # Builds the tmpl-rest-api module (and its shared-* dependencies) and
  # generates the CycloneDX SBOM artifact (bom.xml).
  #
  # The -pl flag limits the build to tmpl-rest-api; -am (also make) ensures
  # that the shared-* modules it depends on are compiled first.
  # ---------------------------------------------------------------------------
  generate-sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build tmpl-rest-api and generate SBOM
        # CONTROL: INI-22 — CycloneDX SBOM generated by cyclonedx-maven-plugin.
        # CONTROL: RN-03  — all direct and transitive dependencies declared in SBOM.
        #
        # -pl tmpl-rest-api  : build only the tmpl-rest-api module
        # -am                : also build its upstream dependencies (shared-*)
        # -DskipTests        : tests are already verified by the CI pipeline;
        #                      this job focuses solely on SBOM generation.
        # cyclonedx:makeAggregateBom: generates the aggregate SBOM including
        #   all transitive dependencies (AC INI-23).
        run: mvn -B -pl tmpl-rest-api -am package -DskipTests cyclonedx:makeAggregateBom

      - name: Verify SBOM artifact exists
        # Fail fast if the SBOM was not produced — SBOM is not optional (spec edge case).
        shell: bash
        run: |
          SBOM_PATH="tmpl-rest-api/target/bom.xml"
          if [ ! -f "$SBOM_PATH" ]; then
            echo "ERROR: SBOM artifact not found at $SBOM_PATH" >&2
            echo "The cyclonedx-maven-plugin did not generate bom.xml." >&2
            echo "Check plugin configuration in tmpl-rest-api/pom.xml." >&2
            exit 1
          fi
          SBOM_SIZE=$(wc -c < "$SBOM_PATH")
          COMPONENT_COUNT=$(grep -c '<component ' "$SBOM_PATH" || true)
          echo "OK: SBOM generated at $SBOM_PATH"
          echo "    Size: ${SBOM_SIZE} bytes"
          echo "    Components declared: ${COMPONENT_COUNT}"

      - name: Upload SBOM as workflow artifact
        # CONTROL: INI-26 — SBOM associado à imagem publicada como OCI artifact
        #   ou atestado. In Phase 1 the SBOM is published as a GitHub Actions
        #   artifact (downloadable via the GitHub UI or API). Phase 2 will
        #   attach the SBOM to the container image via cosign/SLSA attestation.
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: tmpl-rest-api/target/bom.xml
          if-no-files-found: error
          retention-days: 90
